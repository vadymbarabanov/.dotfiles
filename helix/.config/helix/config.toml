theme = "yo"

[editor]
color-modes = true
auto-save = true
end-of-line-diagnostics = "hint"
continue-comments = false

[editor.statusline]
left = ["mode", "read-only-indicator", "file-name", "file-modification-indicator"]
right = ["diagnostics", "version-control", "spacer", "spinner"]

[editor.inline-diagnostics]
cursor-line = "error"

[editor.cursor-shape]
normal = "block"
select = "block"
insert = "bar"

[editor.file-picker]
git-ignore = true

[keys.normal]
x = "select_line_below"
X = "select_line_above"
space.B = ":echo %sh{git blame -L %{cursor_line},+1 %{buffer_name}}"

[keys.select]
x = "select_line_below"
X = "select_line_above"
